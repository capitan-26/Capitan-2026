<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin CAPITÁN</title><script src="jornada.js"></script>
<style>
body{margin:0;background:#090a0c;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#111316;border:1px solid #333;border-radius:16px;padding:14px;margin:12px 0}
h1,h2{margin:0 0 10px}label{display:block;font-size:11px;color:#bbb;margin-top:10px}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #444;background:#08090b;color:#fff;margin-top:5px}
.game{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #333;padding:12px 0}.side{display:flex;gap:8px;align-items:center}.side img{width:44px;height:44px;object-fit:contain}
.btn{padding:13px;border:0;border-radius:12px;font-weight:900;background:#ff1455;color:#fff;width:100%;margin-top:10px}.hint{font-size:12px;color:#aaa;line-height:1.5}
@media(max-width:600px){.game{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>Administrador CAPITÁN</h1>
<div class="hint">Elige los equipos desde el catálogo que me proporcionaste. “Gallos Blancos de Querétaro” se muestra simplemente como <b>Querétaro</b>.</div>
<div class="card">
<label>Jornada</label><input id="jornada"><label>Fecha</label><input id="fecha"><label>Cierre</label><input id="cierre"><label>Precio por combinación</label><input id="precio" type="number"><label>WhatsApp organizador</label><input id="wa"><label>URL Google Apps Script</label><input id="webapp">
</div>
<div class="card"><h2>Partidos</h2><div id="games"></div></div>
<button id="download" class="btn">DESCARGAR jornada.js ACTUALIZADO</button>
</div>
<script>
const C=JSON.parse(JSON.stringify(window.CAPITAN_CONFIG)),cat=C.catalog||[];
const $=id=>document.getElementById(id);
$('jornada').value=C.jornada||'';$('fecha').value=C.fecha||'';$('cierre').value=C.cierre||'';$('precio').value=C.precioBase||30;$('wa').value=C.organizerWhatsApp||'';$('webapp').value=C.webAppUrl||'';
function opts(selected){return cat.map((t,i)=>`<option value="${i}" ${t.name===selected?'selected':''}>${t.name}</option>`).join('')}
$('games').innerHTML=C.partidos.map((g,i)=>`<div class="game">
 <div><b>${i+1}. LOCAL</b><div class="side"><img id="li${i}" src="${g.logoLocal}"><select id="ls${i}">${opts(g.local)}</select></div></div>
 <div><b>VISITANTE</b><div class="side"><img id="vi${i}" src="${g.logoVisitante}"><select id="vs${i}">${opts(g.visitante)}</select></div></div>
 </div>`).join('');
C.partidos.forEach((g,i)=>{['l','v'].forEach(side=>{const sel=$(side+'s'+i),img=$(side+'i'+i);sel.onchange=()=>img.src=cat[+sel.value].logo;});});
$('download').onclick=()=>{
 C.jornada=$('jornada').value.trim();C.fecha=$('fecha').value.trim();C.cierre=$('cierre').value.trim();C.precioBase=Number($('precio').value)||30;C.organizerWhatsApp=$('wa').value.trim();C.webAppUrl=$('webapp').value.trim();
 C.partidos.forEach((g,i)=>{const l=cat[+$('ls'+i).value],v=cat[+$('vs'+i).value];g.local=l.name;g.logoLocal=l.logo;g.visitante=v.name;g.logoVisitante=v.logo;});
 const blob=new Blob(['window.CAPITAN_CONFIG = '+JSON.stringify(C)+';'],{type:'application/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jornada.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
</script></body></html>
