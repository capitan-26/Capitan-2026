<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAPITÁN 2026</title>
<script src="jornada.js"></script>
<style>
:root{--panel:#0b0d0f;--line:#292e34;--text:#f7f8f9;--muted:#9ca3aa;--pink:#ff1455;--pink2:#df0c49}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#030405,#08090b);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:10px 9px 95px}
.hero{display:grid;grid-template-columns:90px 1fr;gap:11px;align-items:center;padding:3px 5px 10px}
.hero>img{width:86px;height:86px;object-fit:contain}
.wordmark b{display:block;font-size:29px;line-height:.92;font-style:italic;letter-spacing:-.03em}.wordmark b span{color:var(--pink)}
.wordmark small{display:block;margin-top:7px;font-size:8.7px;letter-spacing:.12em;color:#ddd}.wordmark small span{color:var(--pink)}

.meta{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden;margin-bottom:9px}
.meta>div{min-height:65px;padding:8px 4px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}.meta>div:last-child{border:0}
.meta b{font-size:11px}.meta small{color:var(--muted);font-size:8.7px;margin-top:3px}
.league-logo{width:158px;max-width:96%;height:43px;object-fit:contain}

.card{background:linear-gradient(180deg,#101316,#090b0d);border:1px solid var(--line);border-radius:17px;padding:11px;margin-bottom:10px}
label{font-size:9.5px;letter-spacing:.12em;color:#d8dbe0}
input{width:100%;margin-top:5px;background:#07090b;border:1px solid #383e45;border-radius:11px;color:white;padding:11px;font-size:13.5px}
.help{margin:11px 1px 6px;font-size:9.8px;line-height:1.35;color:#d8dade}.help b{color:white}.help span{color:var(--pink);font-weight:900}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 4px}.legend span{font-size:9px;border:1px solid #383e44;border-radius:999px;padding:5px 8px;color:#cfd3d8}.legend b{color:var(--pink)}

.match{
 display:grid;
 grid-template-columns:22px minmax(0,1fr) 124px minmax(0,1fr);
 grid-template-areas:
   "num info info info"
   "num local picks away";
 gap:3px 5px;
 align-items:center;
 padding:5px 0 6px;
 border-top:1px solid #22272c;
 min-height:58px
}
.match:first-of-type{border-top:none}
.num{grid-area:num;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--pink);font-size:9.5px;font-weight:950;align-self:center}
.matchinfo{grid-area:info;display:flex;align-items:center;justify-content:center;gap:5px;color:#d8dbe0;font-size:8.1px;letter-spacing:.03em;min-height:12px}
.matchinfo b{font-size:9.1px;color:#fff}.clock{opacity:.9}
.team.local{grid-area:local}.team.r{grid-area:away}
.team{display:flex;align-items:center;gap:6px;min-width:0}
.team.r{justify-content:flex-end;text-align:right}
.team img{width:39px;height:39px;object-fit:contain;flex:0 0 39px}
.team b{font-size:10.6px;white-space:nowrap;overflow:visible;text-overflow:clip}
.pickwrap{grid-area:picks;min-width:0}.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.picks button{height:35px;border:1px solid #55152b;background:#080a0c;color:white;border-radius:9px;font-size:13px;font-weight:950}
.picks button.on{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:var(--pink)}
.comboTag{height:10px;text-align:center;font-size:8px;font-weight:900;color:#ff8cae;margin-top:1px}

.btn{width:100%;border-radius:13px;padding:12px;font-weight:900;font-size:12.5px;margin-top:9px}
.outline{background:transparent;border:1px solid var(--pink);color:var(--pink)}
.primary{border:0;background:linear-gradient(90deg,var(--pink),#e90c4b);color:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.stat{border-right:1px solid #333;padding:2px 3px}.stat:last-child{border:0}
.stat small{display:block;color:var(--muted);font-size:7.8px}.stat strong{display:block;font-size:24px;margin-top:3px}
.notice{text-align:center;color:var(--muted);font-size:9.5px;line-height:1.35;margin-top:6px}

@media(max-width:390px){
 .wrap{padding-left:7px;padding-right:7px}
 .hero{grid-template-columns:80px 1fr}.hero>img{width:76px;height:76px}.wordmark b{font-size:25px}
 .match{grid-template-columns:20px minmax(0,1fr) 112px minmax(0,1fr);gap:3px}
 .team img{width:36px;height:36px;flex-basis:36px}.team{gap:4px}.team b{font-size:10px}
 .picks button{height:33px;font-size:12px}.league-logo{width:128px;height:36px}
}
@media(min-width:600px){
 .wrap{padding-top:16px}.hero{grid-template-columns:145px 1fr}.hero>img{width:140px;height:140px}.wordmark b{font-size:42px}.wordmark small{font-size:11px}
 .match{grid-template-columns:30px 1fr 178px 1fr;padding:8px 0 9px;min-height:78px}.num{width:27px;height:27px;font-size:12px}
 .team img{width:48px;height:48px;flex-basis:48px}.team b{font-size:14px}.picks button{height:42px}
 .matchinfo{font-size:10px}.matchinfo b{font-size:10.5px}.league-logo{height:48px;width:178px}
}

.team b.long1{font-size:9.5px}.team b.long2{font-size:8.9px}
@media(max-width:390px){.team b.long1{font-size:8.7px}.team b.long2{font-size:8.1px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <img id="brandLogo" alt="CAPITÁN">
 <div class="wordmark"><b>QUINIELA <span>CAPITÁN</span></b><small>TU PASIÓN. TU INSTINTO. <span>TU QUINIELA.</span></small></div>
</header>

<section class="meta">
 <div><b id="jornada"></b></div>
 <div><img id="leagueLogo" class="league-logo" alt="Liga BBVA MX"></div>
 <div><b id="fecha"></b><small id="cierre"></small></div>
</section>

<section class="card">
<label>NOMBRE / APODO</label><input id="name" placeholder="Escribe tu nombre o apodo">
<label style="display:block;margin-top:9px">WHATSAPP</label><input id="phone" inputmode="tel" placeholder="Tu número de WhatsApp">
<div class="help"><b id="countGames"></b> · Marca <span>1 = SIMPLE</span>, <span>2 = DOBLE</span>, <span>3 = TRIPLE</span>.</div>
<div class="legend"><span><b>Simple</b> 1 resultado</span><span><b>Doble</b> 2 resultados</span><span><b>Triple</b> L+E+V</span></div>
<div id="matches"></div>
<button id="addTicket" class="btn outline">＋ AGREGAR OTRA QUINIELA</button>
</section>

<section class="card">
<div class="summary">
 <div class="stat"><small>COMBINACIONES</small><strong id="combos">1</strong></div>
 <div class="stat"><small>PRECIO BASE</small><strong id="price">$30</strong></div>
 <div class="stat"><small>TOTAL</small><strong id="total">$30</strong></div>
</div>
<button id="send" class="btn primary">✈ ENVIAR MIS PRONÓSTICOS</button>
<div class="notice">Pago directo con el organizador · Estado inicial: PENDIENTE.</div>
</section>
</div>

<script>
const C=window.CAPITAN_CONFIG,choices=['L','E','V'],$=id=>document.getElementById(id);
$('brandLogo').src=C.brand.logo;$('leagueLogo').src=C.brand.leagueLogo;
['jornada','fecha','cierre'].forEach(k=>$(k).textContent=C[k]);
$('countGames').textContent=C.partidos.length+' PARTIDOS';$('price').textContent='$'+C.precioBase;
let current=C.partidos.map(()=>[]),basket=[];
const combosFor=p=>p.reduce((n,a)=>n*Math.max(1,a.length),1),tag=a=>a.length===2?'DOBLE':a.length===3?'TRIPLE':'';
function render(){
 $('matches').innerHTML=C.partidos.map((g,i)=>`<div class="match">
  <span class="num">${i+1}</span>
  <div class="matchinfo"><b>${C.jornada}</b><span>${g.fecha||''}</span><span class="clock">◷ ${g.hora||''} hr</span></div>
  <div class="team local"><img src="${g.logoLocal}" alt="${g.local}"><b class="${g.local.length>=12?'long2':g.local.length>=10?'long1':''}">${g.local}</b></div>
  <div class="pickwrap"><div class="picks">${choices.map(v=>`<button data-i="${i}" data-v="${v}" class="${current[i].includes(v)?'on':''}">${v}</button>`).join('')}</div><div class="comboTag">${tag(current[i])}</div></div>
  <div class="team r"><b class="${g.visitante.length>=12?'long2':g.visitante.length>=10?'long1':''}">${g.visitante}</b><img src="${g.logoVisitante}" alt="${g.visitante}"></div>
 </div>`).join('');
 $('matches').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,v=b.dataset.v,a=current[i];if(a.includes(v))current[i]=a.filter(x=>x!==v);else a.push(v);render();summary();});
}
function summary(){const saved=basket.reduce((n,e)=>n+e.combos,0),now=current.every(a=>a.length)?combosFor(current):1,c=saved+now;$('combos').textContent=c;$('total').textContent='$'+(c*C.precioBase)}
$('addTicket').onclick=()=>{if(current.some(a=>!a.length))return alert('Completa todos los partidos.');basket.push({picks:current.map(a=>[...a]),combos:combosFor(current)});current=C.partidos.map(()=>[]);render();summary();}
async function postToSheet(payload){
  if(!C.webAppUrl) throw new Error('La automatización todavía no está conectada.');
  await fetch(C.webAppUrl,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'register',payload})
  });
  return true;
}

$('send').onclick=async()=>{
  const name=$('name').value.trim(),phone=$('phone').value.trim();
  if(!name||!phone)return alert('Escribe nombre/apodo y WhatsApp.');
  if(current.some(a=>!a.length))return alert('Completa todos los partidos.');

  const entries=[...basket,{picks:current.map(a=>[...a]),combos:combosFor(current)}];
  const c=entries.reduce((n,e)=>n+e.combos,0);
  const folio='CAP-'+Date.now().toString().slice(-7);

  const payload={
    folio,
    jornada:C.jornada,
    name,
    phone,
    combos:c,
    amount:c*C.precioBase,
    entries:entries.map(e=>({mode:'mixto',combos:e.combos,picks:e.picks})),
    created:new Date().toLocaleString('es-MX')
  };

  const btn=$('send');
  const original=btn.textContent;
  btn.disabled=true;
  btn.textContent='GUARDANDO...';

  try{
    await postToSheet(payload);
    btn.textContent='✓ ENVIADA';
    const msg=encodeURIComponent(
      `CAPITÁN 2026\nFolio: ${folio}\nJugador: ${name}\nWhatsApp: ${phone}\nCombinaciones: ${c}\nTotal: $${payload.amount}\nEstado: PAGO PENDIENTE\n\nAdjunto mi comprobante.`
    );
    const org=(C.organizerWhatsApp||'5530014079').replace(/\D/g,'');
    alert('Pronósticos enviados para registro. Folio: '+folio);
    window.open(`https://wa.me/52${org}?text=${msg}`,'_blank');
  }catch(e){
    alert('No se pudo enviar la quiniela: '+e.message);
    btn.textContent=original;
  }finally{
    btn.disabled=false;
  }
}
render();summary();
</script>
</body></html>
