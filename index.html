<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAPITÁN 2026</title>
<script src="jornada.js"></script>
<style>
:root{--bg:#050607;--panel:#0b0d0f;--line:#2b3035;--text:#f6f7f8;--muted:#9ca3aa;--pink:#ff1455;--pink2:#dc0d49}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#030405,#08090b);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:12px 10px 105px}
.hero{display:grid;grid-template-columns:92px 1fr;gap:11px;align-items:center;padding:4px 5px 12px}
.hero>img{width:88px;height:88px;object-fit:contain}
.wordmark b{display:block;font-size:30px;line-height:.92;font-style:italic;letter-spacing:-.03em}
.wordmark b span{color:var(--pink)}
.wordmark small{display:block;margin-top:8px;font-size:9px;letter-spacing:.13em;color:#ddd}
.wordmark small span{color:var(--pink)}

.meta{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden;margin-bottom:10px}
.meta>div{min-height:72px;padding:9px 5px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.meta>div:last-child{border:0}
.meta b{display:block;font-size:11px}
.meta small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.league-logo{display:block;width:145px;max-width:94%;height:46px;object-fit:contain}

.card{background:linear-gradient(180deg,#101316,#090b0d);border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:11px}
label{font-size:10px;letter-spacing:.12em;color:#d8dbe0}
input{width:100%;margin-top:6px;background:#07090b;border:1px solid #394047;border-radius:11px;color:white;padding:12px;font-size:14px}
.help{margin:13px 2px 7px;font-size:10px;line-height:1.4;color:#d8dade}
.help b{color:white}.help span{color:var(--pink);font-weight:900}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}
.legend span{font-size:9px;border:1px solid #3a3f45;border-radius:999px;padding:5px 8px;color:#cfd3d8}
.legend b{color:var(--pink)}

/* Número ahora completamente al lado izquierdo */
.match{
  display:grid;
  grid-template-columns:24px minmax(0,1fr) 126px minmax(0,1fr);
  gap:6px;
  align-items:center;
  padding:9px 0;
  border-top:1px solid #23282d
}
.match:first-of-type{border-top:none}
.num{
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--pink);
  font-size:10px;font-weight:950;
  justify-self:start
}
.team{display:flex;align-items:center;gap:7px;min-width:0}
.team.r{justify-content:flex-end;text-align:right}
.team img{width:38px;height:38px;object-fit:contain;flex:0 0 38px}
.team b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickwrap{min-width:0}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.picks button{height:38px;border:1px solid #5b1630;background:#080a0c;color:white;border-radius:9px;font-size:14px;font-weight:950}
.picks button.on{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:var(--pink)}
.comboTag{height:12px;text-align:center;font-size:9px;font-weight:900;color:#ff8cae;margin-top:2px}

.btn{width:100%;border-radius:13px;padding:13px;font-weight:900;font-size:13px;margin-top:10px}
.outline{background:transparent;border:1px solid var(--pink);color:var(--pink)}
.primary{border:0;background:linear-gradient(90deg,var(--pink),#e90c4b);color:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat{border-right:1px solid #333;padding:3px 4px}.stat:last-child{border:0}
.stat small{display:block;color:var(--muted);font-size:8px}
.stat strong{display:block;font-size:25px;margin-top:4px}
.notice{text-align:center;color:var(--muted);font-size:10px;line-height:1.4;margin-top:7px}

@media(max-width:430px){
  .match{grid-template-columns:22px minmax(0,1fr) 120px minmax(0,1fr);gap:4px}
  .team img{width:35px;height:35px;flex-basis:35px}
  .team b{font-size:11px}
  .picks button{height:36px}
  .league-logo{width:125px;height:42px}
}
@media(min-width:600px){
  .wrap{padding-top:18px}
  .hero{grid-template-columns:150px 1fr}
  .hero>img{width:145px;height:145px}
  .wordmark b{font-size:42px}
  .wordmark small{font-size:11px}
  .team img{width:48px;height:48px;flex-basis:48px}
  .team b{font-size:14px}
  .match{grid-template-columns:30px 1fr 180px 1fr}
  .num{width:28px;height:28px;font-size:12px}
  .picks button{height:44px}
  .league-logo{height:50px;width:170px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <img id="brandLogo" alt="CAPITÁN">
  <div class="wordmark"><b>QUINIELA <span>CAPITÁN</span></b><small>TU PASIÓN. TU INSTINTO. <span>TU QUINIELA.</span></small></div>
</header>

<section class="meta">
  <div><b id="jornada"></b><small>Jornada</small></div>
  <div><img id="leagueLogo" class="league-logo" alt="Liga BBVA MX"></div>
  <div><b id="fecha"></b><small id="cierre"></small></div>
</section>

<section class="card">
<label>NOMBRE / APODO</label><input id="name" placeholder="Escribe tu nombre o apodo">
<label style="display:block;margin-top:10px">WHATSAPP</label><input id="phone" inputmode="tel" placeholder="Tu número de WhatsApp">

<div class="help"><b id="countGames"></b> · Marca <span>1 opción = SIMPLE</span>, <span>2 = DOBLE</span>, <span>3 = TRIPLE</span>.</div>
<div class="legend"><span><b>Simple</b> 1 resultado</span><span><b>Doble</b> 2 resultados</span><span><b>Triple</b> L+E+V</span></div>
<div id="matches"></div>
<button id="addTicket" class="btn outline">＋ AGREGAR OTRA QUINIELA</button>
</section>

<section class="card">
<div class="summary">
  <div class="stat"><small>COMBINACIONES</small><strong id="combos">1</strong></div>
  <div class="stat"><small>PRECIO BASE</small><strong id="price">$30</strong></div>
  <div class="stat"><small>TOTAL</small><strong id="total">$30</strong></div>
</div>
<button id="send" class="btn primary">✈ ENVIAR MIS PRONÓSTICOS</button>
<div class="notice">Pago directo con el organizador · Estado inicial: PENDIENTE.</div>
</section>
</div>

<script>
const C=window.CAPITAN_CONFIG,choices=['L','E','V'], $=id=>document.getElementById(id);
$('brandLogo').src=C.brand.logo;
$('leagueLogo').src=C.brand.leagueLogo;
['jornada','fecha','cierre'].forEach(k=>$(k).textContent=C[k]);
$('countGames').textContent=C.partidos.length+' PARTIDOS';
$('price').textContent='$'+C.precioBase;

let current=C.partidos.map(()=>[]),basket=[];
const combosFor=p=>p.reduce((n,a)=>n*Math.max(1,a.length),1);
const tag=a=>a.length===2?'DOBLE':a.length===3?'TRIPLE':'';

function render(){
 $('matches').innerHTML=C.partidos.map((g,i)=>`
  <div class="match">
    <span class="num">${i+1}</span>
    <div class="team"><img src="${g.logoLocal}" alt="${g.local}"><b>${g.local}</b></div>
    <div class="pickwrap">
      <div class="picks">${choices.map(v=>`<button data-i="${i}" data-v="${v}" class="${current[i].includes(v)?'on':''}">${v}</button>`).join('')}</div>
      <div class="comboTag">${tag(current[i])}</div>
    </div>
    <div class="team r"><b>${g.visitante}</b><img src="${g.logoVisitante}" alt="${g.visitante}"></div>
  </div>`).join('');

 $('matches').querySelectorAll('button').forEach(b=>b.onclick=()=>{
   const i=+b.dataset.i,v=b.dataset.v,a=current[i];
   if(a.includes(v)) current[i]=a.filter(x=>x!==v); else a.push(v);
   render();summary();
 });
}

function summary(){
 const saved=basket.reduce((n,e)=>n+e.combos,0);
 const now=current.every(a=>a.length)?combosFor(current):1;
 const c=saved+now;
 $('combos').textContent=c;
 $('total').textContent='$'+(c*C.precioBase);
}

$('addTicket').onclick=()=>{
 if(current.some(a=>!a.length))return alert('Completa todos los partidos.');
 basket.push({picks:current.map(a=>[...a]),combos:combosFor(current)});
 current=C.partidos.map(()=>[]);
 render();summary();
}

async function postToSheet(payload){
 if(!C.webAppUrl)return false;
 await fetch(C.webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register',payload})});
 return true;
}

$('send').onclick=async()=>{
 const name=$('name').value.trim(),phone=$('phone').value.trim();
 if(!name||!phone)return alert('Escribe nombre/apodo y WhatsApp.');
 if(current.some(a=>!a.length))return alert('Completa todos los partidos.');

 const entries=[...basket,{picks:current.map(a=>[...a]),combos:combosFor(current)}];
 const c=entries.reduce((n,e)=>n+e.combos,0);
 const folio='CAP-'+Date.now().toString().slice(-7);

 const payload={
   folio,jornada:C.jornada,name,phone,combos:c,amount:c*C.precioBase,
   entries:entries.map(e=>({mode:'mixto',combos:e.combos,picks:e.picks})),
   created:new Date().toLocaleString('es-MX')
 };

 try{await postToSheet(payload)}catch(e){}

 const msg=encodeURIComponent(`CAPITÁN 2026\nFolio: ${folio}\nJugador: ${name}\nWhatsApp: ${phone}\nCombinaciones: ${c}\nTotal: $${payload.amount}\nEstado: PAGO PENDIENTE\n\nAdjunto mi comprobante.`);
 const org=(C.organizerWhatsApp||'5530014079').replace(/\D/g,'');
 window.open(`https://wa.me/52${org}?text=${msg}`,'_blank');
 alert('Quiniela registrada. Folio: '+folio);
}

render();summary();
</script>
</body>
</html>
