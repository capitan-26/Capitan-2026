<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAPITÁN 2026</title>
<script src="jornada.js"></script>
<style>
:root{--bg:#050607;--panel:#0c0e10;--line:#34383d;--soft:#14171a;--text:#f7f7f8;--muted:#a6abb2;--pink:#ff1455;--pink2:#d90f45;--green:#2ecc71}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#030405,#08090b);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px 12px 120px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin:4px 0 14px}
.hero img{width:100%;max-height:150px;object-fit:contain}
.wordmark b{display:block;font-size:38px;line-height:.9;font-style:italic}.wordmark b span{color:var(--pink)}.wordmark small{display:block;margin-top:12px;letter-spacing:.12em;color:#eee}.wordmark small span{color:var(--pink)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.meta div{padding:14px 7px;text-align:center;border-right:1px solid #333}.meta div:last-child{border:0}.meta b{font-size:13px}.meta small{color:var(--muted);display:block;margin-top:4px;font-size:11px}
.card{background:linear-gradient(180deg,#0f1113,#090b0d);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{font-size:11px;letter-spacing:.12em;color:#d6d9dd}input{width:100%;margin-top:7px;background:#080a0c;color:white;border:1px solid #3a3f45;border-radius:12px;padding:13px;font-size:15px}
.hint{margin:14px 2px 6px;color:#e9ebee;font-size:12px;letter-spacing:.07em}.hint span{color:var(--pink)}
.match{display:grid;grid-template-columns:1fr 170px 1fr;gap:9px;align-items:center;padding:8px 0;border-top:1px solid #24282d}
.match:first-of-type{border-top:none}
.team{display:flex;align-items:center;gap:8px;min-width:0}.team.r{justify-content:flex-end;text-align:right}.team img{width:42px;height:42px;object-fit:contain;flex:0 0 42px}.team b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center}.num{width:28px;height:28px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-weight:900}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.picks button{height:42px;border:1px solid #641630;background:#080a0c;color:white;border-radius:10px;font-weight:900;font-size:15px}.picks button.on{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:var(--pink)}
.comboTag{font-size:10px;color:#ff8cab;text-align:center;margin-top:4px;min-height:12px}
.actions{display:grid;gap:9px;margin-top:12px}.btn{border-radius:13px;padding:14px;font-weight:900;font-size:14px;border:0}.outline{background:transparent;border:1px solid var(--pink);color:var(--pink)}.primary{background:linear-gradient(90deg,var(--pink),#e80d4b);color:white}
.summary{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}.stat{border-right:1px solid #34383d}.stat:last-child{border:0}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;font-size:28px;margin-top:4px}
.notice{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
@media(max-width:590px){
 .hero{grid-template-columns:95px 1fr}.wordmark b{font-size:28px}.wordmark small{font-size:10px}
 .match{grid-template-columns:1fr 128px 1fr;gap:5px}.team img{width:34px;height:34px;flex-basis:34px}.team b{font-size:11px}
 .center{grid-template-columns:20px 1fr}.num{width:20px;height:20px;font-size:10px}.picks button{height:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img id="brandLogo" alt="CAPITÁN">
    <div class="wordmark"><b>QUINIELA <span>CAPITÁN</span></b><small>TU PASIÓN. TU INSTINTO. <span>TU QUINIELA.</span></small></div>
  </header>

  <section class="meta">
    <div><b id="jornada"></b><small>Jornada</small></div>
    <div><b id="liga"></b><small>Competencia</small></div>
    <div><b id="fecha"></b><small id="cierre"></small></div>
  </section>

  <section class="card">
    <label>NOMBRE / APODO</label><input id="name" placeholder="Escribe tu nombre o apodo">
    <label style="display:block;margin-top:11px">WHATSAPP</label><input id="phone" inputmode="tel" placeholder="Tu número de WhatsApp">
    <div class="hint"><b id="countGames"></b> · PRONOSTICA <span>L - E - V</span> · selecciona 2 = DOBLE / 3 = TRIPLE</div>
    <div id="matches"></div>
    <div class="actions"><button id="addTicket" class="btn outline">＋ AGREGAR OTRA QUINIELA</button></div>
  </section>

  <section class="card">
    <div class="summary">
      <div class="stat"><small>TUS COMBINACIONES</small><strong id="combos">1</strong></div>
      <div class="stat"><small>PRECIO BASE</small><strong id="price">$30</strong></div>
      <div class="stat"><small>TOTAL A PAGAR</small><strong id="total">$30</strong></div>
    </div>
    <button id="send" class="btn primary" style="width:100%;margin-top:14px">✈ ENVIAR MIS PRONÓSTICOS</button>
    <div class="notice">El pago se realiza directamente con el organizador. Estado inicial: PENDIENTE.</div>
  </section>
</div>
<script>
const C=window.CAPITAN_CONFIG;
document.getElementById('brandLogo').src=C.brand.logo;
['jornada','liga','fecha','cierre'].forEach(k=>document.getElementById(k).textContent=C[k]);
document.getElementById('countGames').textContent=C.partidos.length+' PARTIDOS';
document.getElementById('price').textContent='$'+C.precioBase;

let current=C.partidos.map(()=>[]);
let basket=[];
const choices=['L','E','V'];

function combosFor(picks){return picks.reduce((n,a)=>n*Math.max(1,a.length),1)}
function tag(a){return a.length===2?'DOBLE':a.length===3?'TRIPLE':''}
function render(){
  const root=document.getElementById('matches');
  root.innerHTML=C.partidos.map((g,i)=>`
   <div class="match">
    <div class="team"><img src="${g.logoLocal}" alt=""><b>${g.local}</b></div>
    <div class="center"><span class="num">${i+1}</span><div><div class="picks">
      ${choices.map(v=>`<button data-i="${i}" data-v="${v}" class="${current[i].includes(v)?'on':''}">${v}</button>`).join('')}
    </div><div class="comboTag">${tag(current[i])}</div></div></div>
    <div class="team r"><b>${g.visitante}</b><img src="${g.logoVisitante}" alt=""></div>
   </div>`).join('');
  root.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,v=b.dataset.v,a=current[i];
    if(a.includes(v)) current[i]=a.filter(x=>x!==v);
    else a.push(v);
    render();summary();
  });
}
function summary(){
  const saved=basket.reduce((n,e)=>n+e.combos,0);
  const now=current.every(a=>a.length)?combosFor(current):1;
  const totalCombos=saved+now;
  document.getElementById('combos').textContent=totalCombos;
  document.getElementById('total').textContent='$'+(totalCombos*C.precioBase);
}
document.getElementById('addTicket').onclick=()=>{
  if(current.some(a=>!a.length))return alert('Completa todos los partidos.');
  basket.push({picks:current.map(a=>[...a]),combos:combosFor(current)});
  current=C.partidos.map(()=>[]);render();summary();
}
async function postToSheet(payload){
  if(!C.webAppUrl)return false;
  await fetch(C.webAppUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register',payload})});
  return true;
}
document.getElementById('send').onclick=async()=>{
  const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();
  if(!name||!phone)return alert('Escribe nombre/apodo y WhatsApp.');
  if(current.some(a=>!a.length))return alert('Completa todos los partidos.');
  const entries=[...basket,{picks:current.map(a=>[...a]),combos:combosFor(current)}];
  const totalCombos=entries.reduce((n,e)=>n+e.combos,0);
  const folio='CAP-'+Date.now().toString().slice(-7);
  const payload={folio,jornada:C.jornada,name,phone,combos:totalCombos,amount:totalCombos*C.precioBase,entries:entries.map(e=>({mode:'mixto',combos:e.combos,picks:e.picks})),created:new Date().toLocaleString('es-MX')};
  try{await postToSheet(payload)}catch(e){}
  const msg=encodeURIComponent(`CAPITÁN 2026\nFolio: ${folio}\nJugador: ${name}\nWhatsApp: ${phone}\nCombinaciones: ${totalCombos}\nTotal: $${payload.amount}\nEstado: PAGO PENDIENTE\n\nAdjunto mi comprobante.`);
  const org=(C.organizerWhatsApp||'5530014079').replace(/\D/g,'');
  window.open(`https://wa.me/52${org}?text=${msg}`,'_blank');
  alert('Quiniela registrada. Folio: '+folio);
}
render();summary();
</script>
</body></html>
